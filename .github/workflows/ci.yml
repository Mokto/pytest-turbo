name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: uv run --no-project --with pytest python selfcheck.py
      - run: uv run --no-project --python 3.11 --with pytest --with pytest-rerunfailures --with pytest-timeout --with snapshottest python selfcheck.py  # all blocked in the workers; snapshottest needs imp (< 3.12)
